<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Workspace | AncomeVortex</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23030712' stroke='%2300f2fe' stroke-width='6'/><polygon points='50,18 78,74 22,74' fill='none' stroke='%2300f2fe' stroke-width='5'/><circle cx='50' cy='50' r='8' fill='%2300f2fe'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/glassmorphism.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-black text-center text-white">

  <div class="glass-panel p-5" style="max-width: 480px;">
    <div class="spinner-border text-cyan mb-3" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="text-gradient-cyan mb-2">Synchronizing RBAC Clearance</h4>
    <p class="text-muted-custom small font-mono mb-0" id="redirectMsg">
      Authenticating session credentials and routing to authorized workspace...
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('redirectMsg').textContent = `Clearance Verified: ${user.name} (${user.role.toUpperCase()}). Loading dashboard...`;

      setTimeout(() => {
        if (user.role === 'head') {
          window.location.href = 'dashboard-head.html';
        } else if (user.role === 'admin') {
          window.location.href = 'dashboard-admin.html';
        } else if (user.role === 'employee') {
          window.location.href = 'dashboard-employee.html';
        } else {
          window.location.href = 'dashboard-member.html';
        }
      }, 500);
    });
  </script>
</body>
</html>
